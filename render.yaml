# Render Blueprint for the public demo proxy (dishcovery-proxy/server.js).
# Kept for reference: the demo now runs on Vercel (vercel.json).
#
# Hosted mode is catalog mode: the 150 generated payloads for benchmarking and
# browsing, no Spoonacular calls, no API key, per-IP rate limits. See the
# "Hosted mode" block at the top of server.js.
#
# No rootDir: the server reads ../shared/contract.ts, ../shared/proto and
# ../fixtures/generated, which sit outside dishcovery-proxy/.
services:
  - type: web
    name: dishcovery-proxy
    runtime: node
    plan: free
    region: singapore
    branch: demo-ux
    buildCommand: cd dishcovery-proxy && npm ci --omit=dev
    startCommand: cd dishcovery-proxy && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - dishcovery-proxy/**
        - shared/**
        - fixtures/generated/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.17.1
      - key: DISHCOVERY_MODE
        value: hosted
