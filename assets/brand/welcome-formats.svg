<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <!-- Onboarding step 2 (draft): JSON a readable letter, MessagePack the same letter packed
       tighter, Protocol Buffers a form with fixed fields. Transparent. -->
  <!-- JSON: a letter, every line written out -->
  <rect x="40" y="56" width="160" height="210" rx="14" fill="#ffffff" stroke="#20515a" stroke-width="8"/>
  <rect x="62" y="84" width="72" height="12" rx="6" fill="#20515a"/>
  <rect x="62" y="112" width="116" height="10" rx="5" fill="#20515a" opacity="0.45"/>
  <rect x="62" y="134" width="100" height="10" rx="5" fill="#20515a" opacity="0.45"/>
  <rect x="62" y="156" width="116" height="10" rx="5" fill="#20515a" opacity="0.45"/>
  <rect x="62" y="178" width="84" height="10" rx="5" fill="#20515a" opacity="0.45"/>
  <rect x="62" y="200" width="108" height="10" rx="5" fill="#20515a" opacity="0.45"/>
  <rect x="62" y="222" width="70" height="10" rx="5" fill="#20515a" opacity="0.45"/>
  <!-- MessagePack: the same letter, folded into a smaller packet -->
  <rect x="250" y="116" width="140" height="120" rx="14" fill="#ffffff" stroke="#3c9b9f" stroke-width="8"/>
  <path d="M254 124 L320 178 L386 124" fill="none" stroke="#3c9b9f" stroke-width="8" stroke-linejoin="round"/>
  <rect x="282" y="200" width="76" height="10" rx="5" fill="#3c9b9f" opacity="0.6"/>
  <!-- Protocol Buffers: a form, fixed boxes filled in -->
  <rect x="440" y="86" width="160" height="180" rx="14" fill="#ffffff" stroke="#c1802b" stroke-width="8"/>
  <g fill="#c1802b">
    <rect x="462" y="112" width="20" height="20" rx="4"/>
    <rect x="462" y="150" width="20" height="20" rx="4"/>
    <rect x="462" y="188" width="20" height="20" rx="4"/>
    <rect x="462" y="226" width="20" height="20" rx="4"/>
  </g>
  <g fill="none" stroke="#c1802b" stroke-width="4">
    <rect x="494" y="112" width="84" height="20" rx="4"/>
    <rect x="494" y="150" width="84" height="20" rx="4"/>
    <rect x="494" y="188" width="84" height="20" rx="4"/>
    <rect x="494" y="226" width="84" height="20" rx="4"/>
  </g>
  <g fill="#c1802b" opacity="0.6">
    <rect x="500" y="118" width="48" height="8" rx="4"/>
    <rect x="500" y="156" width="30" height="8" rx="4"/>
    <rect x="500" y="194" width="60" height="8" rx="4"/>
    <rect x="500" y="232" width="40" height="8" rx="4"/>
  </g>
  <!-- Labels -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="120" y="306" fill="#20515a">JSON</text>
    <text x="320" y="306" fill="#3c9b9f">MsgPack</text>
    <text x="520" y="306" fill="#c1802b">Protobuf</text>
  </g>
</svg>
